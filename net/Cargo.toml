[package]
name = "couchsync-net"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
iroh = "1.5"
data-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
